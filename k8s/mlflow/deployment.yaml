apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
                --default-artifact-root "${MLFLOW_DEFAULT_ARTIFACT_ROOT}"
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              value: sqlite:////mlflow/mlflow.db
            - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
              value: gs://mlflow-artifacts-liveness-dev-99/mlflow
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: mlflow-backend-storage
              mountPath: /mlflow
      volumes:
        - name: mlflow-backend-storage
          persistentVolumeClaim:
            claimName: mlflow-backend-pvc
